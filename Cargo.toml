[package]
name = "plex-assistant"
version = "0.4.5"
edition = "2024"
description = "Native STRM support for Plex"
license-file = "LICENSE"
publish = false

[[bin]]
name = "assistant"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
hmac = "0.13.0"
libc = "0.2.191"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
	sha1 = "0.11.0"
	sha2 = "0.11.1"
	thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "process", "signal", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
	tempfile = "3.27.0"
	tract-tensorflow = { version = "0.23.9", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
