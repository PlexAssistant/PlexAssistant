[package]
name = "plex-assistant"
version = "0.1.0"
edition = "2024"
description = "Native STRM support for Plex"
license-file = "LICENSE"
publish = false

[[bin]]
name = "assistant"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
