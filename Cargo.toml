[package]
name = "plex-assistant"
version = "0.5.2"
edition = "2024"
description = "Native STRM support for Plex"
license-file = "LICENSE"
publish = false

[[bin]]
name = "assistant"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
hmac = "0.13.0"
libc = "0.2.191"
pinyin_pro = "3.29.4"
plex-editions = { git = "https://github.com/PlexAssistant/PlexEditions.git", tag = "v0.1.3" }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "process", "signal", "time"] }
tract-tensorflow = { version = "0.23.9", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
