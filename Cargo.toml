[package]
name = "plex-assistant"
version = "0.1.0"
edition = "2024"
description = "Native STRM support for Plex"
license-file = "LICENSE"
publish = false

[[bin]]
name = "assistant"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
libc = "0.2.191"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time"] }
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
