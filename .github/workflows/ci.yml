name: CI

# Tag-driven only: pushing a v* tag runs the gates and publishes the
# multi-arch image to ghcr as both the tag and latest. Nothing runs on
# ordinary pushes or PRs.
#
# Runners are pinned (not ubuntu-latest) so image migrations can't
# shift the build environment under a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # the tag and Cargo.toml must agree before anything is published
      - name: tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          [ "$tag" = "$cargo_version" ] || {
            echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Each arch builds natively on its own runner (the arm64 runners are
  # free for public repos): compiling under QEMU emulation was the
  # single biggest cost of a release, at an hour or more per tag.
  # Each job pushes an untagged digest; the manifest job stitches
  # them into the published multi-arch tags.
  image-amd64:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=ghcr.io/plexassistant/plexassistant,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  image-arm64:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=ghcr.io/plexassistant/plexassistant,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  manifest:
    needs: [image-amd64, image-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: merge arch images into the published tags
        run: |
          docker buildx imagetools create \
            -t ghcr.io/plexassistant/plexassistant:${{ github.ref_name }} \
            -t ghcr.io/plexassistant/plexassistant:latest \
            ghcr.io/plexassistant/plexassistant@${{ needs.image-amd64.outputs.digest }} \
            ghcr.io/plexassistant/plexassistant@${{ needs.image-arm64.outputs.digest }}
