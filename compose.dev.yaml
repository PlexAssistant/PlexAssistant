services:
  fakecloud:
    build:
      context: .
      target: fakecloud
    image: plexassistant-fakecloud:dev
    command: ["--addr", ":8399", "--root", "/media"]
    volumes:
      - ./testdata/media:/media:ro
    ports:
      - "127.0.0.1:8399:8399"

  plex:
    build: .
    image: plexassistant-plex:dev
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Taipei
      - VERSION=docker
    volumes:
      - ./data/config:/config
      - ./testdata/strm:/data/strm:ro
      - ./private:/data/real:ro
      - ./dist:/dist:ro
      - ./scripts/spike:/spike:ro
    ports:
      - "127.0.0.1:32400:32400"
